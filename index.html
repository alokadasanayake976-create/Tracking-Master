
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button.stop {
            background: #dc2626;
        }

        .data {
            background: #334155;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            text-align: left;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Vehicle GPS Tracker</h2>

    <input type="text" id="vehicleId"
           placeholder="Enter Vehicle ID">

    <button onclick="startTracking()">
        Start Tracking
    </button>

    <button class="stop" onclick="stopTracking()">
        Stop Tracking
    </button>

    <div class="data">
        <p id="status">Status: Not Tracking</p>
        <p id="latitude">Latitude: --</p>
        <p id="longitude">Longitude: --</p>
        <p id="accuracy">Accuracy: --</p>
        <p id="speed">Speed: --</p>
    </div>

</div>

<script>

let watchId = null;

function startTracking() {

    const vehicleId =
        document.getElementById("vehicleId").value.trim();

    if (!vehicleId) {
        alert("Please enter a Vehicle ID");
        return;
    }

    if (!navigator.geolocation) {
        alert("GPS is not supported by this browser");
        return;
    }

    if (watchId !== null) {
        return;
    }

    document.getElementById("status").innerText =
        "Status: Waiting for GPS...";

    watchId = navigator.geolocation.watchPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const speed = position.coords.speed;

            document.getElementById("latitude")
                .innerText = "Latitude: " + lat;

            document.getElementById("longitude")
                .innerText = "Longitude: " + lng;

            document.getElementById("accuracy")
                .innerText = "Accuracy: " + accuracy + " meters";

            document.getElementById("speed")
                .innerText = "Speed: " +
                (speed === null ? "Unavailable" :
                (speed * 3.6).toFixed(2) + " km/h");

            document.getElementById("status")
                .innerText = "Status: Tracking Active";

            console.log({
                vehicleId: vehicleId,
                latitude: lat,
                longitude: lng,
                accuracy: accuracy,
                speed: speed,
                timestamp: position.timestamp
            });

        },

        function(error) {

            document.getElementById("status")
                .innerText = "GPS Error: " + error.message;

        },

        {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 15000
        }
    );
}

function stopTracking() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    document.getElementById("status").innerText =
        "Status: Tracking Stopped";
}

</script>

</body>
</html>
